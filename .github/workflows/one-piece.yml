name: One Piece weekly

on:
  schedule:
    - cron: "30 15 * * 0" # Sun 15:30 UTC = ~30 min after MANGA Plus release (Mon 00:00 JST)
    - cron: "0 3 * * 1"   # Mon 03:00 UTC retry, in case the release was late
  workflow_dispatch:       # "Run workflow" button in the Actions tab

env:
  MANGAPLUS_TITLE: "https://mangaplus.shueisha.co.jp/titles/100020" # One Piece (English)
  DRIVE_FOLDER_ID: "1MLbtZhi0npGdKBkvJApSc_rJxz6vi9if"              # Drive: Mangas/OP
  # KCC: Kobo Elipsa profile (1404x1872, same screen as Elipsa 2E), manga RTL, upscale.
  # Output is .kepub.epub. Double-page spreads: -r 0 split (default), 1 rotate, 2 both.
  KCC_FLAGS: "-p KoE -m -u -f EPUB -r 0"
  KCC_VERSION: "v12.1.1"

jobs:
  chapter:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q p7zip-full rclone
          git clone -q --depth 1 --branch "$KCC_VERSION" https://github.com/ciromattia/kcc.git "$RUNNER_TEMP/kcc"
          # KCC's CLI still imports PySide6.QtCore, so the small Essentials wheel is needed.
          pip install -q mloader PySide6-Essentials -r "$RUNNER_TEMP/kcc/requirements-cli.txt"

      - name: Download latest chapter (MANGA Plus)
        run: mloader "$MANGAPLUS_TITLE" --last -o "$PWD/raw"

      - name: Convert for Kobo Elipsa 2E
        run: |
          mkdir -p out
          shopt -s nullglob
          found=0
          while IFS= read -r -d '' cbz; do
            found=1
            num=$(basename "$cbz" | grep -oP ' - [cd]\K\d+' || true)  # "One Piece - d1180 (web) ..." -> 1180
            name="One Piece ${num:-$(basename "$cbz" .cbz)}"
            python "$RUNNER_TEMP/kcc/kcc-c2e.py" $KCC_FLAGS -t "$name" -o "$PWD/kcc_out" "$cbz"
            mv kcc_out/*.kepub.epub "out/$name.kepub.epub"
          done < <(find "$PWD/raw" -name '*.cbz' -print0)
          if [ "$found" = 0 ]; then
            echo "::error::mloader produced no chapter (not free right now, or MANGA Plus changed its API)"
            exit 1
          fi
          ls -la out

      - name: Upload to Google Drive (skips chapters already there)
        env:
          RCLONE_CONFIG_GDRIVE_TYPE: drive
          RCLONE_CONFIG_GDRIVE_SCOPE: drive
          RCLONE_CONFIG_GDRIVE_TOKEN: ${{ secrets.RCLONE_DRIVE_TOKEN }}
          RCLONE_CONFIG_GDRIVE_ROOT_FOLDER_ID: ${{ env.DRIVE_FOLDER_ID }}
        run: "rclone copy out gdrive: --ignore-existing -v"
